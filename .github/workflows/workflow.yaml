name: Smoketest
on: push
# Cancel old runs when a new commit is pushed to the same branch if not on main or dev
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 
    github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 
    'refs/heads/dev' }}
defaults:
  run:
    working-directory: .
jobs:
  smoketest:
    runs-on: ubuntu-20.04
    services:
      pypi_wayback:
        image: ghcr.io/waleko/pypi-wayback
        ports:
        - 8629:8080
    timeout-minutes: 10
    strategy:
      matrix:
        python_version:
        - '3.8'
        - '3.9'
        - '3.10'
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python_version }}
    - name: Setup
      run: |
        set -ex
        python -m pip install --upgrade 'pip<23' wheel
        python -m pip install --upgrade .
        python -m pip install pytest==7.2.1 pytest_codeblocks==0.16.1
    - name: Run checks
      run: |
        pytest tests/test_smoketest.py

env:
  PIP_INDEX_URL: http://localhost:8629/2023-11-27
  UV_INDEX_URL: http://localhost:8629/2023-11-27
